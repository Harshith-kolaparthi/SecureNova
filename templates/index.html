
<!DOCTYPE html>
<html>
<head>
    <title>SecureNova AI Chat</title>
</head>
<body>
    <h1>SecureNova AI Assistant</h1>

    {% if user %}
        <h3>Welcome, {{ user.get("name", "User") }}</h3>

        <p>You are authenticated through Auth0.</p>

        <form action="/chat-ui" method="POST">
            <input
                type="text"
                name="message"
                placeholder="Ask SecureNova something..."
                required
            >
            <button type="submit">Send</button>
        </form>

        <br>
        <a href="/logout">Logout</a>

    {% else %}
        <p>Please log in to access the AI assistant.</p>
        <a href="/login">
            <button>Login with Auth0</button>
        </a>
    {% endif %}

</body>
</html>
